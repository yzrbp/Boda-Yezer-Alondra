<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#F6E2EA;
    font-family:Arial,sans-serif;
}

.player{
    text-align:center;
}

/* Imagen */
img{
    width:100%;
    max-width:300px;
    height:auto;
    border-radius:15px;
    margin-bottom:20px;

    /* Fade In */
    opacity:0;
    animation:fadeIn 4s ease forwards;
}

/* Botón */
button{
    width:60px;
    height:60px;
    border:none;
    border-radius:50%;
    font-size:30px;
    background:#b8896b;
    color:white;
    cursor:pointer;

    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    background:#a9795d;
}

/* Animación */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="player">

<img src="IMG_5850.jpg" alt="Nosotros">

<br>

<button onclick="playMusic()">▶</button>

<audio id="music">
    <source src="All About Us.mp3" type="audio/mpeg">
</audio>

</div>

<script>
function playMusic(){
    document.getElementById("music").play();
}
</script>

</body>
</html>
